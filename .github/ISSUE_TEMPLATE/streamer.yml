name: 🎥 Add / fix a streamer
description: Add a streamer to streamers.yaml or fix their channels
labels: [roster]
body:
  - type: input
    id: name
    attributes:
      label: Streamer name
    validations:
      required: true
  - type: dropdown
    id: lang
    attributes:
      label: Language
      options: [es, en, pt, other]
  - type: textarea
    id: channels
    attributes:
      label: Official channels (links)
      description: Kick / Twitch / YouTube. Please confirm these are the real accounts.
    validations:
      required: true
